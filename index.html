<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Deododo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        header {
            background: #2d89ef;
            color: white;
            padding: 40px;
        }

            margin: 50px auto;

        button {

            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.9;

<header>
    <h1>Website Deododo</h1>

<div class="container">

    </p>

    <button onclick="alert('Halo! Terima kasih sudah mengunjungi website ini')">

</html>
