<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deododo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:white;
    overflow-x:hidden;
}

html{
    scroll-behavior:smooth;
}

/* ================= HERO ================= */
.hero{
    width:100%;
    min-height:100vh;
    display:flex;
    position:relative;
    overflow:hidden;
    background:white;
}

.left{
    width:50%;
    min-height:100vh;
    opacity:0;
    transform:translateY(-60px);
}

.left img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.right{
    width:50%;
    min-height:100vh;
    background:#efc3d2;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    opacity:0;
    transform:translateY(60px);
}

.right.show{ animation:fadeBottom 1s forwards; }
.left.show{ animation:fadeTop 1s forwards; }

.content{
    width:80%;
    text-align:center;
}

.logo{
    width:75%;
    max-width:520px;
    margin-bottom:40px;
}

.question{
    font-size:clamp(28px,3vw,68px);
    font-weight:800;
    color:black;
    margin-bottom:18px;
}

.slogan{
    font-size:clamp(26px,2.5vw,56px);
    font-weight:800;
    color:white;
    margin-bottom:100px;
}

.desc{
    font-size:clamp(16px,1.8vw,30px);
    font-weight:700;
}

/* ================= PAGE 2 (IMPORTANT FIX AREA) ================= */
.page2{
    width:100%;
    min-height:100vh;   /* ❗ FIX: pastikan tidak collapse jadi putih */
    background:#eeeeee;
    padding:18px 24px;
    display:block;
}

/* ================= MOBILE HERO IMAGE ================= */
.mobile-hero-image{
    display:none;
    width:100%;
}

/* ================= ANIMATIONS ================= */
@keyframes fadeTop{
    from{opacity:0; transform:translateY(-60px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes fadeBottom{
    from{opacity:0; transform:translateY(60px);}
    to{opacity:1; transform:translateY(0);}
}

/* ================= TABLET FIX ================= */
@media(max-width:1024px){

    .hero{
        flex-direction:column;
        min-height:auto;
    }

    .left,
    .right{
        width:100%;
        min-height:auto;
    }

    .right{
        padding:60px 30px; /* FIX poin 2 ikut terbawa aman */
    }

    .content{
        width:90%;
    }

    .logo{
        width:60%;
        margin-bottom:25px;
    }

    .slogan{
        margin-bottom:40px;
    }

    /* ❗ FIX penting agar page2 tidak “hilang putih” */
    .page2{
        min-height:auto;
    }
}

/* ================= MOBILE FIX (POIN 2) ================= */
@media(max-width:768px){

    .hero{
        flex-direction:column;
        min-height:100vh;
    }

    .left{
        display:none;
    }

    .mobile-hero-image{
        display:block;
    }

    .mobile-hero-image img{
        width:100%;
        display:block;
    }

    .right{
        width:100%;
        min-height:auto;

        /* ✔ PERBAIKAN POIN 2 UTAMA */
        padding:40px 20px 50px 20px;
    }

    .content{
        width:100%;
        padding:20px 0;
    }

    .question{ font-size:26px; }
    .slogan{ font-size:26px; margin-bottom:40px; }
    .desc{ font-size:15px; }
}

/* ================= SMALL MOBILE ================= */
@media(max-width:480px){

    .right{
        padding:30px 16px 40px 16px;
    }

    .question{ font-size:22px; }
    .slogan{ font-size:22px; }
    .desc{ font-size:14px; }
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">

    <div class="mobile-hero-image">
        <img src="produk.jpg">
    </div>

    <section class="left" id="leftSection">
        <img src="produk.jpg">
    </section>

    <section class="right" id="rightSection">
        <div class="content">
            <img src="logo.png" class="logo">

            <div class="question">Tiny spray, big difference?</div>
            <div class="slogan">Glow up, smell up!</div>

            <div class="desc">
                Kunjungi FK-1 untuk mendapatkan<br>
                deodoran mini ini!
            </div>
        </div>
    </section>

</div>

<!-- PAGE 2 (SUDAH TIDAK AKAN PUTIH LAGI) -->
<section class="page2">

    <!-- KONTEN PAGE 2 KAMU TETAP DI SINI -->
    <div style="padding:20px; font-weight:700;">
        Page 2 content tetap aman (tidak hilang lagi)
    </div>

</section>

<script>
window.addEventListener("load", () => {
    document.getElementById("leftSection")?.classList.add("show");
    document.getElementById("rightSection")?.classList.add("show");
});
</script>

</body>
</html>
