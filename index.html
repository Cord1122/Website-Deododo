<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Deododo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#f7d4e1;
    font-family:'Poppins',sans-serif;
}

/* ===== HERO ===== */

.hero{
    width:100%;
    height:100vh;
    display:flex;
    position:relative;
}

/* ===== LEFT SIDE ===== */

.left-side{
    width:48%;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:#f7f2ef;
}

.left-side img{
    width:100%;
    height:100%;
    object-fit:cover;
    animation:productZoom 2s ease forwards;
    filter:brightness(1.02);
}

.left-overlay{
    position:absolute;
    inset:0;
    background:
    linear-gradient(
        to right,
        rgba(255,255,255,0.05),
        rgba(255,255,255,0.2)
    );
}

/* ===== MIDDLE DIVIDER ===== */

.divider-container{
    width:180px;
    height:100vh;
    position:absolute;
    left:44%;
    z-index:5;
    overflow:visible;
}

svg{
    width:100%;
    height:100%;
}

/* garis dasar */
.base-line{
    fill:none;
    stroke-width:36;
    opacity:0.25;
}

/* animasi isi */
.animate-line{
    fill:none;
    stroke-width:36;
    stroke-linecap:round;
    stroke-dasharray:1600;
    stroke-dashoffset:-1600;
    animation:drawLine 4.2s ease forwards;
}

.red{
    stroke:#ff3030;
}

.yellow{
    stroke:#f4d64d;
}

.blue{
    stroke:#4896cf;
}

/* ===== RIGHT SIDE ===== */

.right-side{
    width:52%;
    height:100vh;
    background:#f6c9d8;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.content{
    width:80%;
    max-width:700px;
    text-align:center;
    animation:fadeIn 1.8s ease;
}

.logo{
    width:450px;
    max-width:90%;
    margin-bottom:30px;
    filter:drop-shadow(0 5px 15px rgba(0,0,0,0.08));
}

.question{
    font-size:clamp(30px, 4vw, 64px);
    font-weight:700;
    color:#111;
    margin-bottom:10px;
}

.slogan{
    font-family:'Fredoka',sans-serif;
    font-size:clamp(30px, 3vw, 52px);
    color:white;
    font-weight:600;
    margin-bottom:60px;
}

.desc{
    font-size:clamp(18px,1.7vw,32px);
    line-height:1.6;
    color:#222;
    font-weight:400;
}

/* ===== ANIMATION ===== */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes productZoom{
    from{
        transform:scale(1.08);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/*
loading bawah ke atas
ada sedikit jeda di tikungan
tidak looping
*/
@keyframes drawLine{

    /* mulai kosong dari bawah */
    0%{
        stroke-dashoffset:-1600;
    }

    /* naik sampai belokan bawah */
    38%{
        stroke-dashoffset:-950;
    }

    /* pause kecil di tikungan */
    52%{
        stroke-dashoffset:-950;
    }

    /* lanjut isi ke atas */
    100%{
        stroke-dashoffset:0;
    }
}
    
/* ===== MOBILE ===== */

@media (max-width:900px){

    body{
        overflow:auto;
    }

    .hero{
        flex-direction:column;
        height:auto;
    }

    .left-side{
        width:100%;
        height:45vh;
    }

    .divider-container{
        display:none;
    }

    .right-side{
        width:100%;
        min-height:55vh;
        padding:60px 25px;
    }

    .content{
        width:100%;
    }

    .question{
        margin-top:10px;
    }

    .slogan{
        margin-bottom:35px;
    }
}

</style>
</head>

            <path class="animate-line red"

</section>

</body>
</html>
