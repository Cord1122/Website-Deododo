<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deododo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:white;
}

/* =======================
MAIN CONTAINER
======================= */

.hero{
    width:100%;
    height:100vh;
    display:flex;
    position:relative;
    overflow:hidden;
    background:white;
}

/* =======================
LEFT SIDE
======================= */

.left{
    width:50%;
    height:100%;
    position:relative;
    overflow:hidden;
    opacity:0;
    transform:translateY(-70px);
}

.left.show{
    animation:leftReveal 1.2s ease forwards;
}

.left img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =======================
RIGHT SIDE
======================= */

.right{
    width:50%;
    height:100%;
    background:#f5c6d5;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;

    opacity:0;
    transform:translateY(70px);
}

.right.show{
    animation:rightReveal 1.2s ease forwards;
}

.content{
    width:80%;
    text-align:center;
    margin-top:-20px;
}

.logo{
    width:78%;
    max-width:650px;
    margin-bottom:50px;
}

.question{
    font-size:clamp(28px,3vw,62px);
    font-weight:800;
    color:black;
    margin-bottom:15px;
}

.slogan{
    font-size:clamp(26px,2.8vw,58px);
    font-weight:800;
    color:white;
    margin-bottom:130px;
}

.desc{
    font-size:clamp(20px,1.8vw,38px);
    font-weight:600;
    line-height:1.4;
    color:black;
}

/* =======================
DIVIDER OVERLAY
======================= */

.divider{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    width:260px;
    height:100%;
    z-index:999;
    pointer-events:none;
}

.divider svg{
    width:100%;
    height:100%;
}

/* garis dasar transparan */
.base{
    fill:none;
    stroke-width:36;
    opacity:0;
}

/* garis animasi */
.line{
    fill:none;
    stroke-width:28;
    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:1800;
    stroke-dashoffset:-1800;

    animation:drawLine 4.2s ease forwards;
}

.red{
    stroke:#ff3131;
}

.yellow{
    stroke:#f6d550;
}

.blue{
    stroke:#4393d0;
}

/* =======================
ANIMATIONS
======================= */

/* garis bawah ke atas + pause */
@keyframes drawLine{

    0%{
        stroke-dashoffset:-1800;
    }

    /* sampai belokan */
    40%{
        stroke-dashoffset:-1050;
    }

    /* pause kecil */
    54%{
        stroke-dashoffset:-1050;
    }

    /* lanjut */
    100%{
        stroke-dashoffset:0;
    }
}

@keyframes leftReveal{
    from{
        opacity:0;
        transform:translateY(-70px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes rightReveal{
    from{
        opacity:0;
        transform:translateY(70px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =======================
MOBILE
======================= */

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .hero{
        flex-direction:column;
        height:auto;
    }

    .left{
        width:100%;
        height:45vh;
    }

    .right{
        width:100%;
        min-height:55vh;
        padding:50px 25px;
    }

    .divider{
        display:none;
    }

    .content{
        width:100%;
    }

    .logo{
        width:90%;
        margin-bottom:30px;
    }

    .question{
        margin-bottom:8px;
    }

    .slogan{
        margin-bottom:50px;
    }

    .desc{
        font-size:22px;
    }
}

</style>
</head>

<body>

<div class="hero">

    <!-- LEFT -->
    <section class="left" id="leftSection">
        <img src="produk.jpg" alt="Produk Deododo">
    </section>

    <!-- RIGHT -->
    <section class="right" id="rightSection">

        <div class="content">

            <img src="logo.png"
            class="logo"
            alt="Logo Deododo">

            <h1 class="question">
                Tiny spray, big difference?
            </h1>

            <div class="slogan">
                Glow up, smell up!
            </div>

            <div class="desc">
                Kunjungi FK-1 untuk mendapatkan
                <br>
                deodoran mini ini!
            </div>

        </div>

    </section>

<!-- DIVIDER -->
<div class="divider">

<svg viewBox="0 0 260 1000" preserveAspectRatio="none">

    <!-- RED -->
    <path class="line red"
    d="
    M 160 -20
    L 95 170
    L 55 790
    Q 52 900 0 1000
    "/>

    <!-- YELLOW -->
    <path class="line yellow"
    d="
    M 190 -20
    L 125 170
    L 85 790
    Q 82 900 30 1000
    "/>

    <!-- BLUE -->
    <path class="line blue"
    d="
    M 220 -20
    L 155 170
    L 115 790
    Q 112 900 60 1000
    "/>

</svg>

</div>

</div>

<script>

/*
setelah garis selesai
baru kiri & kanan muncul
bersamaan
*/

setTimeout(() => {

    document
    .getElementById("leftSection")
    .classList.add("show");

    document
    .getElementById("rightSection")
    .classList.add("show");

}, 4100);

</script>

</body>
</html>
