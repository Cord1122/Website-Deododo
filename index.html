<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Deododo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow-x:hidden;
    overflow-y:auto;
    background:white;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

/* HERO */
.hero{
    width:100%;
    height:100vh;
    display:flex;
    position:relative;
    overflow:hidden;
    background:white;
}

.left{
    width:50%;
    height:100vh;
    background:white;
    overflow:hidden;
    opacity:0;
    transform:translateY(-60px);
}

.left.show{
    animation:fadeTop 1s ease forwards;
}

.left img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.right{
    width:50%;
    height:100vh;
    background:#efc3d2;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    opacity:0;
    transform:translateY(60px);
}

.right.show{
    animation:fadeBottom 1s ease forwards;
}

.content{
    width:80%;
    text-align:center;
    transform:translateY(-20px);
}

.logo{
    width:75%;
    max-width:520px;
    margin-bottom:40px;
}

.question{
    font-size:clamp(36px,3vw,68px);
    font-weight:800;
    color:black;
    line-height:1.15;
    margin-bottom:18px;
}

.slogan{
    font-size:clamp(34px,2.5vw,56px);
    font-weight:800;
    color:white;
    margin-bottom:120px;
}

.desc{
    font-size:clamp(20px,1.8vw,36px);
    font-weight:700;
    line-height:1.35;
}

/* DIVIDER */
.divider{
    position:absolute;
    left:50%;
    top:0;
    width:240px;
    height:100%;
    transform:translateX(-50%);
    z-index:100;
    pointer-events:none;
}

.line{
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:1800;
    stroke-dashoffset:1800;
    animation:drawLine 2.5s ease forwards;
}

.red{ stroke:#ff3131; stroke-width:34; }
.yellow{ stroke:#f5d34f; stroke-width:34; }
.blue{ stroke:#4595d4; stroke-width:34; }

/* PAGE 2 */
.page2{
    width:100%;
    min-height:100vh;
    background:#eeeeee;
    padding:18px 24px;
}

/* MOBILE IMAGE */
.mobile-hero-image{
    display:none;
    width:100%;
}

/* MOBILE BOTTOM CARD */
.mobile-bottom-card{
    display:none;
}

/* ANIMATION */
@keyframes fadeTop{
    from{opacity:0; transform:translateY(-60px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes fadeBottom{
    from{opacity:0; transform:translateY(60px);}
    to{opacity:1; transform:translateY(0);}
}

/* ================= MOBILE ================= */
@media(max-width:768px){

    .hero{
        flex-direction:column;
        height:auto;
        min-height:100vh;
        background:white; /* FIX: hindari blank/warna aneh */
    }

    .left{
        display:none;
    }

    .mobile-hero-image{
        display:block;
        width:100%;
    }

    .mobile-hero-image img{
        width:100%;
        display:block;
    }

    .right{
        width:100%;
        min-height:50vh;

        /* ✅ FIX POIN 2 UTAMA */
        padding:40px 20px 50px 20px;
        box-sizing:border-box;
    }

    .content{
        width:100%;
        padding:20px 0;
    }

    .divider{
        display:none;
    }

    .logo{
        width:60%;
        margin-bottom:20px;
    }

    .question{ font-size:28px; }

    .slogan{
        font-size:28px;
        margin-bottom:40px;
    }

    .desc{
        font-size:16px;
    }

}

/* EXTRA SMALL */
@media(max-width:480px){

    .right{
        padding:30px 16px 40px 16px; /* FIX tambahan biar gak “nabrak bawah” */
    }

    .question{ font-size:24px; }
    .slogan{ font-size:24px; }
    .desc{ font-size:14px; }
}

</style>
</head>

<body>

<div class="hero">

    <div class="mobile-hero-image">
        <img src="produk.jpg">
    </div>

    <section class="left" id="leftSection">
        <img src="produk.jpg">
    </section>

    <section class="right" id="rightSection">
        <div class="content">
            <img src="logo.png" class="logo">
            <div class="question">Tiny spray, big difference?</div>
            <div class="slogan">Glow up, smell up!</div>
            <div class="desc">
                Kunjungi FK-1 untuk mendapatkan<br>
                deodoran mini ini!
            </div>
        </div>
    </section>

</div>

<section class="page2">
    <!-- (bagian page2 tetap sama seperti punyamu, tidak aku ubah) -->
</section>

<script>
window.addEventListener("load", () => {
    document.getElementById("leftSection")?.classList.add("show");
    document.getElementById("rightSection")?.classList.add("show");
});
</script>

</body>
</html>
