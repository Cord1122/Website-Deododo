<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Deododo - Deodorant Alami</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: #fef6f0;
        overflow-x: hidden;
    }

    /* =====================
    MOBILE PAGE - SESUAI GAMBAR
    ===================== */

    .mobile-page {
        max-width: 500px;
        margin: 0 auto;
        background: #fef6f0;
        min-height: 100vh;
        padding: 24px 20px 50px;
    }

    /* Corner stripes pojok kiri atas */
    .corner-stripes {
        position: relative;
        margin-bottom: 20px;
    }

    .stripe {
        height: 12px;
        border-bottom-right-radius: 20px;
    }

    .stripe-red {
        background: #ff3131;
        width: 80px;
    }
    .stripe-yellow {
        background: #f5d34f;
        width: 70px;
        margin-top: 4px;
    }
    .stripe-blue {
        background: #4595d4;
        width: 60px;
        margin-top: 4px;
    }

    /* Judul utama */
    .main-title {
        font-size: 52px;
        font-weight: 800;
        color: #5d4c52;
        text-align: center;
        margin: 10px 0 20px;
        letter-spacing: -0.5px;
    }

    /* Deskripsi produk */
    .description {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.55;
        color: #3a2c32;
        text-align: center;
        background: rgba(239, 201, 191, 0.4);
        padding: 16px 18px;
        border-radius: 28px;
        margin-bottom: 35px;
    }

    /* 3 RASA (Jasmine, Rose, Lavender) - tampil horizontal */
    .flavors-container {
        display: flex;
        justify-content: center;
        gap: 32px;
        margin-bottom: 30px;
        flex-wrap: wrap;
    }

    .flavor-item {
        text-align: center;
    }

    .flavor-name {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    .flavor-jasmine {
        color: #e8a0b5;
    }
    .flavor-rose {
        color: #ff5d66;
    }
    .flavor-lavender {
        color: #9334d9;
    }

    .flavor-underline {
        width: 45px;
        height: 3px;
        background: #d9c2b5;
        margin: 8px auto 0;
        border-radius: 4px;
    }

    /* Gambar produk (botol deodoran) */
    .product-image-container {
        display: flex;
        justify-content: center;
        margin: 20px 0 15px;
    }

    .product-bottle {
        width: 180px;
        filter: drop-shadow(6px 12px 18px rgba(0,0,0,0.12));
    }

    /* =====================
    GARIS PEMBATAS (TANPA ANIMASI)
    DILETAKKAN DI ANTARA GAMBAR PRODUK DAN BAGIAN BAWAH
    ===================== */
    .divider-line {
        width: 100%;
        display: flex;
        justify-content: center;
        margin: 20px 0 25px;
    }
    
    .divider-bars {
        display: flex;
        gap: 8px;
        justify-content: center;
    }
    
    .divider-bar {
        width: 60px;
        height: 5px;
        border-radius: 10px;
    }
    
    .divider-red {
        background: #ff3131;
    }
    .divider-yellow {
        background: #f5d34f;
    }
    .divider-blue {
        background: #4595d4;
    }

    /* =====================
    KOTAK MENGGUNAKAN BAHAN ALAMI
    ===================== */
    .natural-card {
        background: #efc9bf;
        border-radius: 32px;
        padding: 35px 20px;
        margin-bottom: 20px;
        position: relative;
        overflow: hidden;
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .natural-text {
        font-size: 28px;
        font-weight: 900;
        color: #1c1418;
        text-align: center;
        line-height: 1.35;
        letter-spacing: 1px;
        z-index: 2;
        position: relative;
    }

    /* Dekorasi bunga di natural card */
    .flower-deco {
        position: absolute;
        opacity: 0.5;
        pointer-events: none;
    }

    .flower-deco-1 {
        top: 10px;
        left: 10px;
        width: 70px;
    }
    .flower-deco-2 {
        top: 5px;
        right: 15px;
        width: 65px;
    }
    .flower-deco-3 {
        bottom: 8px;
        right: 10px;
        width: 75px;
    }

    /* =====================
    KOTAK TAWAS
    ===================== */
    .tawas-card {
        background: #efc9bf;
        border-radius: 32px;
        padding: 24px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
    }

    .tawas-title {
        font-size: 62px;
        font-weight: 900;
        color: rgba(255, 248, 235, 0.92);
        letter-spacing: -1px;
        line-height: 1;
    }

    .tawas-image {
        width: 110px;
        height: auto;
        filter: drop-shadow(4px 8px 12px rgba(0,0,0,0.1));
    }

    /* Spacer */
    .spacer {
        height: 20px;
    }

    /* =====================
    RESPONSIVE UNTUK LAYAR SANGAT KECIL
    ===================== */
    @media (max-width: 450px) {
        .mobile-page {
            padding: 16px 16px 40px;
        }
        .main-title {
            font-size: 44px;
        }
        .flavor-name {
            font-size: 24px;
        }
        .flavors-container {
            gap: 20px;
        }
        .natural-text {
            font-size: 24px;
        }
        .tawas-title {
            font-size: 50px;
        }
        .tawas-image {
            width: 90px;
        }
        .description {
            font-size: 13px;
            padding: 14px;
        }
        .product-bottle {
            width: 150px;
        }
        .divider-bar {
            width: 45px;
        }
    }

    @media (max-width: 380px) {
        .tawas-card {
            flex-direction: column;
            text-align: center;
        }
        .flavor-name {
            font-size: 20px;
        }
        .main-title {
            font-size: 38px;
        }
        .natural-text {
            font-size: 20px;
        }
        .flavors-container {
            gap: 14px;
        }
        .divider-bar {
            width: 35px;
        }
    }
</style>
</head>
<body>

<div class="mobile-page">
    
    <!-- Corner stripes pojok kiri atas -->
    <div class="corner-stripes">
        <div class="stripe stripe-red"></div>
        <div class="stripe stripe-yellow"></div>
        <div class="stripe stripe-blue"></div>
    </div>

    <!-- Judul Utama -->
    <div class="main-title">
        Deododo
    </div>

    <!-- Deskripsi Produk -->
    <div class="description">
        Deododo adalah deodoran spray yang menggunakan tawas sebagai bahan utamanya.<br>
        Dengan 3 rasa yang bisa dipilih dari Jasmine hingga Lavender pasti akan menemani anda sepanjang hari.
    </div>

    <!-- 3 Varian Rasa (Jasmine, Rose, Lavender) -->
    <div class="flavors-container">
        <div class="flavor-item">
            <div class="flavor-name flavor-jasmine">Jasmine</div>
            <div class="flavor-underline"></div>
        </div>
        <div class="flavor-item">
            <div class="flavor-name flavor-rose">Rose</div>
            <div class="flavor-underline"></div>
        </div>
        <div class="flavor-item">
            <div class="flavor-name flavor-lavender">Lavender</div>
            <div class="flavor-underline"></div>
        </div>
    </div>

    <!-- Gambar produk (botol deodoran) -->
    <div class="product-image-container">
        <svg class="product-bottle" viewBox="0 0 120 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="35" y="35" width="50" height="115" rx="15" fill="#eab9c9" stroke="#b35d7c" stroke-width="2.5"/>
            <path d="M40 140 L80 140 L74 170 L46 170 Z" fill="#cea2b2"/>
            <circle cx="60" cy="65" r="14" fill="#ffe0e7"/>
            <text x="60" y="105" text-anchor="middle" fill="#6e3b4d" font-size="12" font-weight="bold">spray</text>
        </svg>
    </div>

    <!-- ===================== -->
    <!-- GARIS PEMBATAS (TANPA ANIMASI) -->
    <!-- DILETAKKAN DI ANTARA GAMBAR PRODUK DAN BAGIAN BAWAH -->
    <!-- ===================== -->
    <div class="divider-line">
        <div class="divider-bars">
            <div class="divider-bar divider-red"></div>
            <div class="divider-bar divider-yellow"></div>
            <div class="divider-bar divider-blue"></div>
        </div>
    </div>

    <!-- Kotak MENGGUNAKAN BAHAN ALAMI -->
    <div class="natural-card">
        <!-- Dekorasi bunga -->
        <svg class="flower-deco flower-deco-1" viewBox="0 0 80 80" fill="none">
            <circle cx="40" cy="40" r="30" fill="#ffb7c5" opacity="0.7"/>
            <circle cx="40" cy="25" r="12" fill="#ffe0e7"/>
            <circle cx="55" cy="40" r="12" fill="#ffe0e7"/>
            <circle cx="40" cy="55" r="12" fill="#ffe0e7"/>
            <circle cx="25" cy="40" r="12" fill="#ffe0e7"/>
        </svg>
        <svg class="flower-deco flower-deco-2" viewBox="0 0 80 80" fill="none">
            <path fill="#d6b0e0" d="M40 15 L48 32 L67 35 L52 48 L58 67 L40 56 L22 67 L28 48 L13 35 L32 32 Z" opacity="0.6"/>
        </svg>
        <svg class="flower-deco flower-deco-3" viewBox="0 0 80 80" fill="none">
            <circle cx="40" cy="40" r="28" fill="#f9e0a8" opacity="0.7"/>
            <circle cx="40" cy="40" r="14" fill="#f8c471"/>
        </svg>
        
        <div class="natural-text">
            MENGGUNAKAN<br>BAHAN ALAMI
        </div>
    </div>

    <!-- Kotak TAWAS -->
    <div class="tawas-card">
        <div class="tawas-title">
            TAWAS
        </div>
        <svg class="tawas-image" viewBox="0 0 130 130" fill="none">
            <rect x="25" y="20" width="80" height="90" rx="16" fill="#e8e0d3" stroke="#b2977a" stroke-width="3"/>
            <polygon points="55,20 75,20 70,8 60,8" fill="#cdb89a"/>
            <rect x="38" y="48" width="54" height="14" fill="#bcab8f" rx="4"/>
            <rect x="42" y="72" width="46" height="12" fill="#bcab8f" rx="4"/>
            <text x="65" y="102" text-anchor="middle" fill="#8b6b4f" font-size="11" font-weight="bold">alami</text>
        </svg>
    </div>

    <div class="spacer"></div>

</div>

</body>
</html>
