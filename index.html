<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Deododo - Deodorant Alami</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: #f5f0eb;
        overflow-x: hidden;
    }

    /* =====================
    MOBILE PAGE - SESUAI GAMBAR
    ===================== */

    .mobile-page {
        max-width: 500px;
        margin: 0 auto;
        background: #fef6f0;
        min-height: 100vh;
        padding: 24px 20px 40px;
        box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    /* Corner stripes seperti gambar */
    .corner-stripes-mobile {
        position: relative;
        margin-bottom: 20px;
    }

    .stripe-mobile {
        height: 12px;
        border-bottom-right-radius: 20px;
    }

    .stripe-red-mobile {
        background: #ff3131;
        width: 80px;
    }
    .stripe-yellow-mobile {
        background: #f5d34f;
        width: 70px;
        margin-top: 4px;
    }
    .stripe-blue-mobile {
        background: #4595d4;
        width: 60px;
        margin-top: 4px;
    }

    /* Judul utama */
    .main-title {
        font-size: 48px;
        font-weight: 800;
        color: #5d4c52;
        text-align: center;
        margin: 20px 0 16px;
        letter-spacing: -0.5px;
    }

    /* Deskripsi */
    .description {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.55;
        color: #3a2c32;
        text-align: center;
        background: rgba(239, 201, 191, 0.4);
        padding: 16px 18px;
        border-radius: 28px;
        margin-bottom: 32px;
    }

    /* 3 RASA - tampil horizontal */
    .flavors-container {
        display: flex;
        justify-content: center;
        gap: 24px;
        margin-bottom: 48px;
        flex-wrap: wrap;
    }

    .flavor-item {
        text-align: center;
        min-width: 90px;
    }

    .flavor-name {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    .flavor-jasmine {
        color: #e8a0b5;
    }
    .flavor-rose {
        color: #ff5d66;
    }
    .flavor-lavender {
        color: #9334d9;
    }

    /* Garis dekorasi bawah rasa */
    .flavor-underline {
        width: 40px;
        height: 3px;
        background: #d9c2b5;
        margin: 8px auto 0;
        border-radius: 4px;
    }

    /* Kotak BAHAN ALAMI */
    .natural-card-mobile {
        background: #efc9bf;
        border-radius: 32px;
        padding: 28px 20px;
        margin-bottom: 20px;
        position: relative;
        overflow: hidden;
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .natural-text-mobile {
        font-size: 28px;
        font-weight: 900;
        color: #1c1418;
        text-align: center;
        line-height: 1.3;
        letter-spacing: 1px;
        z-index: 2;
        position: relative;
    }

    /* Dekorasi bunga di natural card */
    .flower-deco-mobile {
        position: absolute;
        opacity: 0.5;
        pointer-events: none;
    }

    .flower-deco-1 {
        top: 10px;
        left: 10px;
        width: 70px;
    }
    .flower-deco-2 {
        top: 5px;
        right: 15px;
        width: 65px;
    }
    .flower-deco-3 {
        bottom: 8px;
        right: 10px;
        width: 75px;
    }

    /* Kotak TAWAS */
    .tawas-card-mobile {
        background: #efc9bf;
        border-radius: 32px;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
    }

    .tawas-title-mobile {
        font-size: 56px;
        font-weight: 900;
        color: rgba(255, 248, 235, 0.92);
        letter-spacing: -1px;
        line-height: 1;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.05);
    }

    .tawas-image-mobile {
        width: 110px;
        height: auto;
        filter: drop-shadow(4px 8px 12px rgba(0,0,0,0.15));
    }

    /* Gambar botol produk (dekorasi) */
    .product-bottle-mobile {
        display: flex;
        justify-content: center;
        margin: 16px 0 8px;
    }
    .bottle-icon {
        width: 140px;
        opacity: 0.7;
    }

    /* Tambahan gaya */
    .spacer {
        height: 8px;
    }

    /* Garis pemisah dekoratif */
    .divider-line {
        width: 60px;
        height: 3px;
        background: linear-gradient(90deg, #ff3131, #f5d34f, #4595d4);
        margin: 20px auto;
        border-radius: 4px;
    }

    /* Responsive kecil */
    @media (max-width: 450px) {
        .mobile-page {
            padding: 16px 16px 32px;
        }
        .main-title {
            font-size: 42px;
        }
        .flavor-name {
            font-size: 24px;
        }
        .flavors-container {
            gap: 16px;
        }
        .natural-text-mobile {
            font-size: 24px;
        }
        .tawas-title-mobile {
            font-size: 44px;
        }
        .tawas-image-mobile {
            width: 90px;
        }
        .description {
            font-size: 13px;
            padding: 14px;
        }
    }

    @media (max-width: 380px) {
        .tawas-card-mobile {
            flex-direction: column;
            text-align: center;
        }
        .flavor-name {
            font-size: 20px;
        }
        .main-title {
            font-size: 36px;
        }
        .natural-text-mobile {
            font-size: 20px;
        }
    }
</style>
</head>
<body>

<div class="mobile-page">
    
    <!-- Corner stripes (atas kiri) -->
    <div class="corner-stripes-mobile">
        <div class="stripe-mobile stripe-red-mobile"></div>
        <div class="stripe-mobile stripe-yellow-mobile"></div>
        <div class="stripe-mobile stripe-blue-mobile"></div>
    </div>

    <!-- Judul Utama -->
    <div class="main-title">
        Deododo
    </div>

    <!-- Deskripsi Produk -->
    <div class="description">
        Deododo adalah deodoran spray yang menggunakan tawas sebagai bahan utamanya.<br>
        Dengan 3 rasa yang bisa dipilih dari Jasmine hingga Lavender pasti akan menemani anda sepanjang hari.
    </div>

    <!-- 3 Varian Rasa (Jasmine, Rose, Lavender) -->
    <div class="flavors-container">
        <div class="flavor-item">
            <div class="flavor-name flavor-jasmine">Jasmine</div>
            <div class="flavor-underline"></div>
        </div>
        <div class="flavor-item">
            <div class="flavor-name flavor-rose">Rose</div>
            <div class="flavor-underline"></div>
        </div>
        <div class="flavor-item">
            <div class="flavor-name flavor-lavender">Lavender</div>
            <div class="flavor-underline"></div>
        </div>
    </div>

    <!-- Gambar botol kecil (dekorasi) -->
    <div class="product-bottle-mobile">
        <svg class="bottle-icon" viewBox="0 0 100 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="30" y="30" width="40" height="90" rx="12" fill="#eab9c9" stroke="#b35d7c" stroke-width="2"/>
            <path d="M35 115 L65 115 L60 140 L40 140 Z" fill="#cea2b2"/>
            <circle cx="50" cy="55" r="10" fill="#ffe0e7"/>
            <text x="50" y="85" text-anchor="middle" fill="#6e3b4d" font-size="10" font-weight="bold">spray</text>
        </svg>
    </div>

    <!-- Garis pemisah warna-warni -->
    <div class="divider-line"></div>

    <!-- Kotak MENGGUNAKAN BAHAN ALAMI -->
    <div class="natural-card-mobile">
        <!-- Dekorasi bunga (mirip gambar) -->
        <svg class="flower-deco-mobile flower-deco-1" viewBox="0 0 80 80" fill="none">
            <circle cx="40" cy="40" r="30" fill="#ffb7c5" opacity="0.7"/>
            <circle cx="40" cy="25" r="12" fill="#ffe0e7"/>
            <circle cx="55" cy="40" r="12" fill="#ffe0e7"/>
            <circle cx="40" cy="55" r="12" fill="#ffe0e7"/>
            <circle cx="25" cy="40" r="12" fill="#ffe0e7"/>
        </svg>
        <svg class="flower-deco-mobile flower-deco-2" viewBox="0 0 80 80" fill="none">
            <path fill="#d6b0e0" d="M40 15 L48 32 L67 35 L52 48 L58 67 L40 56 L22 67 L28 48 L13 35 L32 32 Z" opacity="0.6"/>
        </svg>
        <svg class="flower-deco-mobile flower-deco-3" viewBox="0 0 80 80" fill="none">
            <circle cx="40" cy="40" r="28" fill="#f9e0a8" opacity="0.7"/>
            <circle cx="40" cy="40" r="14" fill="#f8c471"/>
        </svg>
        
        <div class="natural-text-mobile">
            MENGGUNAKAN<br>BAHAN ALAMI
        </div>
    </div>

    <!-- Kotak TAWAS -->
    <div class="tawas-card-mobile">
        <div class="tawas-title-mobile">
            TAWAS
        </div>
        <svg class="tawas-image-mobile" viewBox="0 0 120 120" fill="none">
            <rect x="25" y="20" width="70" height="80" rx="14" fill="#e8e0d3" stroke="#b2977a" stroke-width="3"/>
            <polygon points="55,20 65,20 62,10 58,10" fill="#cdb89a"/>
            <rect x="38" y="45" width="44" height="12" fill="#bcab8f" rx="3"/>
            <rect x="42" y="65" width="36" height="10" fill="#bcab8f" rx="3"/>
            <text x="60" y="95" text-anchor="middle" fill="#8b6b4f" font-size="10" font-weight="bold">alami</text>
        </svg>
    </div>

    <!-- Spacer bawah -->
    <div class="spacer"></div>

</div>

</body>
</html>
