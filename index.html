<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deododo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:white;
}

.hero{
    width:100%;
    height:100vh;
    display:flex;
    position:relative;
    overflow:hidden;
    background:white;
}

/* =====================
LEFT
===================== */

.left{
    width:50%;
    height:100vh;
    background:white;
    overflow:hidden;
    opacity:0;
    transform:translateY(-60px);
}

.left.show{
    animation:fadeTop 1s ease forwards;
}

.left img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =====================
RIGHT
===================== */

.right{
    width:50%;
    height:100vh;
    background:#efc3d2;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    opacity:0;
    transform:translateY(60px);
}

.right.show{
    animation:fadeBottom 1s ease forwards;
}

.content{
    width:80%;
    text-align:center;
    transform:translateY(-20px);
}

.logo{
    width:75%;
    max-width:520px;
    margin-bottom:40px;
}

.question{
    font-size:clamp(36px,3vw,68px);
    font-weight:800;
    color:black;
    line-height:1.15;
    margin-bottom:18px;
}

.slogan{
    font-size:clamp(34px,2.5vw,56px);
    font-weight:800;
    color:white;
    margin-bottom:120px;
}

.desc{
    font-size:clamp(20px,1.8vw,36px);
    font-weight:700;
    line-height:1.35;
}

/* =====================
DIVIDER
===================== */

.divider{
    position:absolute;
    left:50%;
    top:0;
    width:240px;
    height:100%;
    transform:translateX(-50%);
    z-index:100;
    pointer-events:none;
}

.divider svg{
    width:100%;
    height:100%;
}

/* path animation */

.line{
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:1800;
    stroke-dashoffset:1800;

    animation:drawLine 3.8s ease forwards;
}

/* lebih mirip Canva */
.red{
    stroke:#ff3131;
    stroke-width:34;
}

.yellow{
    stroke:#f5d34f;
    stroke-width:34;
}

.blue{
    stroke:#4595d4;
    stroke-width:34;
}

/* =====================
ANIMATION
===================== */

/* pause di bawah */
@keyframes drawLine{

    0%{
        stroke-dashoffset:1800;
    }

    35%{
        stroke-dashoffset:900;
    }

    /* pause */
    48%{
        stroke-dashoffset:900;
    }

    100%{
        stroke-dashoffset:0;
    }
}

@keyframes fadeTop{
    from{
        opacity:0;
        transform:translateY(-60px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeBottom{
    from{
        opacity:0;
        transform:translateY(60px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =====================
RESPONSIVE
===================== */

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .hero{
        flex-direction:column;
        height:auto;
    }

    .left,
    .right{
        width:100%;
    }

    .left{
        height:45vh;
    }

    .right{
        min-height:55vh;
        padding:50px 30px;
    }

    .divider{
        display:none;
    }

    .logo{
        width:90%;
    }

    .slogan{
        margin-bottom:50px;
    }
}

</style>
</head>
<body>

<div class="hero">

    <!-- LEFT -->
    <section class="left" id="leftSection">
        <img src="produk.jpg" alt="Produk Deododo">
    </section>

    <!-- RIGHT -->
    <section class="right" id="rightSection">

        <div class="content">

            <img src="logo.png" class="logo">

            <div class="question">
                Tiny spray, big difference?
            </div>

            <div class="slogan">
                Glow up, smell up!
            </div>

            <div class="desc">
                Kunjungi FK-1 untuk mendapatkan
                <br>
                deodoran mini ini!
            </div>

        </div>

    </section>

    <!-- DIVIDER -->
    <div class="divider">

        <svg viewBox="0 0 240 1000" preserveAspectRatio="none">

            <!-- RED -->
            <path class="line red"
            d="
            M 165 -50
            L 120 160
            L 120 790
            Q 120 900 40 1020
            " />

            <!-- YELLOW -->
            <path class="line yellow"
            d="
            M 195 -50
            L 150 160
            L 150 790
            Q 150 900 70 1020
            " />

            <!-- BLUE -->
            <path class="line blue"
            d="
            M 225 -50
            L 180 160
            L 180 790
            Q 180 900 100 1020
            " />

        </svg>

    </div>

</div>

<script>

setTimeout(() => {

    document
    .getElementById("leftSection")
    .classList.add("show");

    document
    .getElementById("rightSection")
    .classList.add("show");

}, 3700);

</script>

</body>
</html>
