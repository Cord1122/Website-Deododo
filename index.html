<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Deododo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:white;
}

body{
    position:relative;
}

/* ===========================
LAYOUT
=========================== */

.container{
    width:100%;
    height:100vh;
    display:flex;
    position:relative;
    overflow:hidden;
    background:white;
}

/* ===========================
LEFT
=========================== */

.left{
    width:50%;
    height:100%;
    background:#fff;
    position:relative;
    overflow:hidden;

    opacity:0;
    transform:translateY(-70px);
}

.left.show{
    animation:fadeTop 1.2s ease forwards;
}

/* gambar canva */
.left-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===========================
RIGHT
=========================== */

.right{
    width:50%;
    height:100%;
    background:#f7c6d8;
    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;
    transform:translateY(70px);
}

.right.show{
    animation:fadeBottom 1.2s ease forwards;
}

.content{
    width:80%;
    text-align:center;
}

.logo{
    width:72%;
    max-width:520px;
    margin-bottom:50px;
}

.question{
    font-size:clamp(30px,3vw,62px);
    font-weight:800;
    line-height:1.2;
    margin-bottom:20px;
    color:black;
}

.slogan{
    font-size:clamp(30px,3vw,60px);
    font-weight:800;
    color:white;
    margin-bottom:140px;
}

.desc{
    font-size:clamp(20px,1.7vw,36px);
    font-weight:700;
    line-height:1.45;
}

/* ===========================
DIVIDER
=========================== */

.divider{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    width:300px;
    height:110vh;
    z-index:9999;
    pointer-events:none;
}

.divider svg{
    width:100%;
    height:100%;
}

/* garis */

.line{
    fill:none;
    stroke-width:28;
    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:1900;
    stroke-dashoffset:-1900;

    animation:drawLine 4s ease forwards;
}

.red{
    stroke:#ff3131;
}

.yellow{
    stroke:#f6d550;
}

.blue{
    stroke:#4393d0;
}

/* ===========================
ANIMATION
=========================== */

/*
garis loading:
bawah ke atas
pause di tikungan
lalu lanjut
*/

@keyframes drawLine{

    0%{
        stroke-dashoffset:-1900;
    }

    /* sampai belokan */
    42%{
        stroke-dashoffset:-1080;
    }

    /* pause */
    58%{
        stroke-dashoffset:-1080;
    }

    /* selesai */
    100%{
        stroke-dashoffset:0;
    }
}

@keyframes fadeTop{
    from{
        opacity:0;
        transform:translateY(-70px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeBottom{
    from{
        opacity:0;
        transform:translateY(70px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ===========================
RESPONSIVE
=========================== */

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .container{
        flex-direction:column;
        height:auto;
    }

    .left{
        width:100%;
        height:50vh;
    }

    .right{
        width:100%;
        min-height:50vh;
        padding:50px 20px;
    }

    .divider{
        display:none;
    }

    .logo{
        width:85%;
        margin-bottom:30px;
    }

    .slogan{
        margin-bottom:60px;
    }
}

</style>
</head>
<body>

<div class="container">

    <!-- LEFT -->
    <section class="left" id="leftPanel">
        <img src="produk.jpg"
        class="left-image"
        alt="Produk Deododo">
    </section>

    <!-- RIGHT -->
    <section class="right" id="rightPanel">

        <div class="content">

            <img src="logo.png"
            class="logo"
            alt="Logo Deododo">

            <h1 class="question">
                Tiny spray, big difference?
            </h1>

            <div class="slogan">
                Glow up, smell up!
            </div>

            <div class="desc">
                Kunjungi FK-1 untuk mendapatkan
                <br>
                deodoran mini ini!
            </div>

        </div>

    </section>

    <!-- DIVIDER -->
    <div class="divider">

        <svg viewBox="0 0 300 1100" preserveAspectRatio="none">

            <!-- RED -->
            <path
            class="line red"
            d="
            M 185 -50
            L 125 160
            L 110 900
            Q 110 1000 50 1120
            " />

            <!-- YELLOW -->
            <path
            class="line yellow"
            d="
            M 220 -50
            L 160 160
            L 145 900
            Q 145 1000 85 1120
            " />

            <!-- BLUE -->
            <path
            class="line blue"
            d="
            M 255 -50
            L 195 160
            L 180 900
            Q 180 1000 120 1120
            " />

        </svg>

    </div>

</div>

<script>

/*
setelah divider selesai
baru panel muncul
bersamaan
*/

setTimeout(()=>{

    document
    .getElementById("leftPanel")
    .classList.add("show");

    document
    .getElementById("rightPanel")
    .classList.add("show");

},4000);

</script>

</body>
</html>
